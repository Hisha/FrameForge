name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FrameForge.slnx

      - name: Build
        run: dotnet build FrameForge.slnx -c Release --no-restore

      - name: Test
        run: dotnet test FrameForge.slnx -c Release --no-build
